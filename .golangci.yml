version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unused
  settings:
    errcheck:
      # Conventionally-ignored error returns: http writes/closes where there
      # is no meaningful recovery, and Close on already-consumed bodies.
      exclude-functions:
        - (io.Closer).Close
        - (*bytes.Buffer).ReadFrom
        - (net/http.ResponseWriter).Write
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1008", "-ST1012", "-ST1016", "-ST1017", "-ST1020", "-ST1021", "-ST1022", "-QF1008", "-QF1012"]
  exclusions:
    rules:
      # Tests commonly ignore errors and use weak randomness intentionally.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - path: test/integration/
        linters:
          - unused
      # GitHub webhook signature validation intentionally uses HMAC-SHA1
      # (GitHub sends X-Hub-Signature with sha1); sha256 is also supported.
      - path: pkg/git/github/validateSecret\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
