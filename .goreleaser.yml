version: 2
project_name: dinghy
before:
  hooks:
    - go mod tidy
    - go test -v ./...
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - '-s -w'
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
dockers:
  - image_templates: ["ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:{{ .Version }}"]
    dockerfile: Dockerfile
    build_flag_templates:
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.description={{ .ProjectName }}'
      - '--label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_REPOSITORY }}'
      - '--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.licenses=Apache-2.0'
changelog:
  disable: true