version: 2
project_name: dinghy
before:
  hooks:
    - go mod tidy
    - go test -v ./...
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - '-s -w'
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
dockers_v2:
  - images:
      - "ghcr.io/{{ tolower .Env.GITHUB_REPOSITORY }}"
    tags:
      - "v{{ .Version }}"
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "{{ .ProjectName }}"
      "org.opencontainers.image.url": "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      "org.opencontainers.image.source": "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "Apache-2.0"
changelog:
  disable: true